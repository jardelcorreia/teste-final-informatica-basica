<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Informática Básica</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="quiz-container">
        <div class="quiz-header">
            <h1>Quiz de Informática Básica</h1>
            <div class="quiz-progress">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
            <div class="high-score-display" id="high-score-display">HighScore: 0</div> <!-- New Element -->
        </div>
        
        <div id="quiz">
            <div class="quiz-body">
                <div class="question" id="question"></div>
                <div class="options" id="options"></div>
            </div>
            
            <div class="quiz-footer">
                <div class="question-counter" id="question-counter"></div>
                <button class="btn btn-next" id="next-btn" disabled>Próxima Pergunta</button>
                <!-- Add these for review mode, initially hidden -->
                <div class="review-nav" id="review-nav" style="display: none;">
                    <button class="btn btn-prev-review" id="prev-review-btn">Anterior</button>
                    <button class="btn btn-next-review" id="next-review-btn">Próxima</button>
                    <button class="btn btn-exit-review" id="exit-review-btn">Sair da Revisão</button>
                </div>
            </div>
        </div>
        
        <div class="result-container" id="result-container">
            <h2 class="result-title">Quiz Concluído!</h2>
            <div class="result-score" id="result-score"></div>
            <p class="result-message" id="result-message"></p>

            <!-- Add this new container -->
            <div class="detailed-results" id="detailed-results">
                <h3>Resumo Detalhado:</h3>
                <!-- Detailed results will be populated here by JavaScript -->
            </div>

            <button class="btn btn-restart" id="restart-btn">Refazer Quiz</button>
            <button class="btn btn-review" id="review-btn">Revisar Respostas</button> <!-- New Button -->
        </div>
    </div>

<!-- Add this footer section after the main content of the page, before </body> -->
<footer>
    <div class="footer-content">
        <div class="developer-info">
            <img src="https://i.ibb.co/LDXnb9vR/20250315-212822-2.jpg" alt="Foto do Desenvolvedor" class="dev-photo">
            <div class="dev-details">
                <p class="dev-name">Jardel Correia</p> <!-- Assuming name, can be omitted if not desired -->
                <p class="dev-links">
                    <a href="https://github.com/jardelcorreia" target="_blank" rel="noopener noreferrer">GitHub</a> |
                    <a href="https://instagram.com/jardelcorreia" target="_blank" rel="noopener noreferrer">Instagram</a> |
                    <a href="mailto:jardel.lc@gmail.com">jardel.lc@gmail.com</a>
                </p>
            </div>
        </div>
        <p class="copyright">&copy; 2025 Quiz de Informática Básica. Todos os direitos reservados.</p>
    </div>
</footer>

    <script src="script.js"></script>
</body>
</html>
